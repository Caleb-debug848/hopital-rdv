<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="whiteLogoGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="whiteLogoGlow" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <filter id="whiteLogoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Emblème Croix Vectorielle Découpée -->
  <g filter="url(#whiteLogoShadow)" transform="translate(2, 0)">
    <rect x="21" y="8" width="18" height="48" rx="9" fill="url(#whiteLogoGrad)" />
    <rect x="6" y="23" width="48" height="18" rx="9" fill="url(#whiteLogoGrad)" />
    <path d="M12 32h9l3.5-7 5 14 4.5-9 3 2h11" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="46" cy="15" r="4.5" fill="url(#whiteLogoGlow)" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Typographie Vectorielle Blanche pour Arrière-plan Sombre -->
  <g transform="translate(70, 0)">
    <text x="0" y="36" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="25" font-weight="800" letter-spacing="-0.03em" fill="#FFFFFF">
      Hôpital <tspan fill="#60A5FA">RDV</tspan>
    </text>
    
    <text x="1" y="52" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.16em" fill="#94A3B8">
      SANTÉ CONNECTÉE
    </text>
  </g>
</svg>
